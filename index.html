<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>EvoAgent STD v7.1</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧬</text></svg>">
<script src="license-check.js"></script>
<script src="core.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap');
:root{--bg:#05050a;--panel:#0c101d;--border:#00f3ff;--accent:#ff0066;--amber:#ffaa00;--green:#39ff14;--text:#e0e6f0;--dim:#4a5570;--err:#ff4444}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace;min-height:100vh;overflow-x:hidden}
.container{max-width:1400px;margin:0 auto;padding:20px}
header{text-align:center;margin-bottom:20px}
h1{font-family:'Orbitron',sans-serif;font-size:28px;background:linear-gradient(90deg,var(--border),var(--accent),var(--amber));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px}
.sub{color:var(--dim);font-size:12px;margin-top:4px;letter-spacing:1px}
.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media(max-width:1100px){.grid{grid-template-columns:1fr}}
.panel{background:rgba(12,16,29,0.85);backdrop-filter:blur(10px);border:1px solid rgba(0,243,255,0.2);border-radius:12px;padding:16px;box-shadow:0 0 8px var(--border)}
.panel h2{font-family:'Orbitron',sans-serif;font-size:13px;color:var(--border);margin-bottom:12px;text-transform:uppercase;letter-spacing:1px}
textarea,input,select{width:100%;background:#080c18;border:1px solid rgba(0,243,255,0.3);color:var(--text);padding:10px;border-radius:6px;font:inherit;font-size:13px;resize:vertical}
textarea{min-height:140px;font-size:14px}
.btn{background:linear-gradient(135deg,rgba(0,243,255,0.15),rgba(0,243,255,0.05));border:1px solid var(--border);color:var(--border);padding:9px 14px;border-radius:6px;font-weight:600;cursor:pointer;font-size:12px;text-transform:uppercase;letter-spacing:1px}
.btn:hover{background:var(--border);color:var(--bg)}
.btn.green{border-color:var(--green);color:var(--green)}
.btn.accent{border-color:var(--accent);color:var(--accent)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tag{display:inline-block;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;margin:3px}
.tag.type{background:rgba(0,243,255,0.15);color:var(--border);border:1px solid rgba(0,243,255,0.3)}
.tag.low{background:rgba(57,255,20,0.15);color:var(--green)}
.tag.med{background:rgba(255,170,0,0.15);color:var(--amber)}
.tag.high{background:rgba(255,0,102,0.15);color:var(--accent)}
.tag.cr{background:rgba(255,0,0,0.2);color:#ff4444}
.tag.route{background:rgba(161,140,209,0.15);color:#c9a7eb}
.tag.sentiment{background:rgba(255,255,0,0.1);color:#ffff00}
.dec{background:rgba(8,12,24,0.7);border:1px solid rgba(0,243,255,0.2);border-radius:8px;padding:12px;margin-bottom:10px}
.raz{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.5;font-style:italic}
.xai-box{background:rgba(8,12,24,0.7);border:1px solid rgba(255,170,0,0.3);border-radius:8px;padding:12px;margin-top:10px;font-size:11px;line-height:1.6}
.xai-box h3{color:var(--amber);font-size:12px;margin-bottom:8px}
.prob-bar{height:4px;background:rgba(255,255,255,0.1);border-radius:2px;margin:2px 0;overflow:hidden}
.prob-fill{height:100%;background:linear-gradient(90deg,var(--border),var(--accent));border-radius:2px;transition:width 0.3s}
.toast{position:fixed;bottom:20px;right:20px;padding:12px 16px;border-radius:8px;font-size:12px;font-weight:600;z-index:9999;transform:translateY(100px);opacity:0;transition:all 0.3s}
.toast.show{transform:translateY(0);opacity:1}
.toast.ok{background:rgba(57,255,20,0.15);border:1px solid var(--green);color:var(--green)}
.toast.err{background:rgba(255,68,68,0.15);border:1px solid var(--err);color:var(--err)}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;color:var(--dim);font-size:14px}
#loading.hidden{display:none}
.status-bar{padding:6px 10px;border-radius:4px;font-size:10px;display:inline-block;margin-top:8px}
.status-bar.ok{background:rgba(57,255,20,0.15);color:var(--green)}
.status-bar.err{background:rgba(255,68,68,0.15);color:var(--err)}
</style>
</head>
<body>

<div id="loading">⏳ Загрузка модели...</div>

<div class="container">
  <header>
    <h1>🧬 EVOAGENT STD v7.1</h1>
    <div class="sub">КЛАССИФИКАТОР ДОКУМЕНТОВ • ОФЛАЙН</div>
  </header>

  <div class="grid">
    <div class="panel">
      <h2>📄 Входящий документ</h2>
      <textarea id="doc" placeholder="Введите текст документа... (Ctrl+Enter для анализа)"></textarea>
      <div class="row">
        <button class="btn" onclick="analyze()">🔬 Анализ</button>
        <button class="btn accent" onclick="loadSample(0)">Договор</button>
        <button class="btn accent" onclick="loadSample(1)">Счёт</button>
        <button class="btn green" onclick="loadSample(2)">Жалоба</button>
      </div>
      <div id="statusBar" class="status-bar err">● Ожидание загрузки...</div>
    </div>

    <div class="panel">
      <h2>🎯 Решение агента</h2>
      <div id="out" style="color:var(--dim);text-align:center;padding:40px 0">Ожидание ввода...</div>
      <div id="probs" style="font-size:10px;color:var(--dim);margin-top:8px;display:none"></div>
      <div id="xaiBox" class="xai-box" style="display:none"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// Проверка лицензии
if (typeof checkLicense === 'function' && !checkLicense()) {
  document.body.innerHTML = '<div style="text-align:center;padding:100px;color:#ff4444;font-size:18px">❌ Лицензия не активирована</div>';
}

// Ожидание загрузки модели
EvoAgent.onReady(() => {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('statusBar').className = 'status-bar ok';
  document.getElementById('statusBar').textContent = '● Модель загружена';
});

// Таймаут на случай если weights.json не загрузился
setTimeout(() => {
  if (!EvoAgent.isReady()) {
    document.getElementById('loading').innerHTML =
      '<div style="text-align:center;color:#ff4444">' +
      '<div style="font-size:18px;margin-bottom:10px">❌ Модель не загружена</div>' +
      '<div style="font-size:12px;color:#888">Запустите: <code style="background:#222;padding:2px 6px;border-radius:3px">npm run build:weights</code></div>' +
      '<div style="font-size:12px;color:#888;margin-top:4px">Затем скопируйте <code style="background:#222;padding:2px 6px;border-radius:3px">core/weights.json</code> в папку с <code style="background:#222;padding:2px 6px;border-radius:3px">index.html</code></div>' +
      '</div>';
  }
}, 3000);

function showToast(m, t = 'ok') {
  const e = document.getElementById('toast');
  e.textContent = m;
  e.className = 'toast ' + t + ' show';
  setTimeout(() => e.classList.remove('show'), 3000);
}

function analyze() {
  if (!EvoAgent.isReady()) return showToast('⏳ Модель ещё загружается', 'err');

  const t = document.getElementById('doc').value.trim();
  if (!t) return showToast('⚠️ Введите текст', 'err');

  try {
    const r = EvoAgent.classify(t);
    const pc = { 'низкий': 'low', 'средний': 'med', 'высокий': 'high', 'критический': 'cr' }[r.prio] || 'med';
    const conf = (r.confidence * 100).toFixed(1);
    const sc = r.sentiment === 'позитивный' ? '#39ff14' : (r.sentiment === 'негативный' ? '#ff4444' : '#ffaa00');

    document.getElementById('out').innerHTML = `
      <div class="dec">
        <span class="tag type">📋 ${r.type.toUpperCase()}</span>
        <span class="tag ${pc}">⚡ ${r.prio.toUpperCase()}</span>
        <span class="tag route">📤 → ${r.route}</span>
        <span class="tag sentiment" style="border-color:${sc}">💬 ${r.sentiment.toUpperCase()}</span>
        <div class="raz">Уверенность: <b style="color:var(--green)">${conf}%</b></div>
      </div>
    `;

    let ph = '<div style="margin-top:8px;font-size:10px;"><div style="color:var(--border);margin-bottom:4px;">📊 Топ типы:</div>';
    const scores = r.scores.types;
    const total = Object.values(scores).reduce((a, b) => a + b, 1);
    const top = Object.keys(scores).sort((a, b) => scores[b] - scores[a]).slice(0, 3);
    top.forEach(k => {
      const p = ((scores[k] || 0) / total) * 100;
      ph += `<div>${k} <span style="color:var(--green)">${p.toFixed(1)}%</span><div class="prob-bar"><div class="prob-fill" style="width:${p}%"></div></div></div>`;
    });
    ph += '</div>';
    document.getElementById('probs').innerHTML = ph;
    document.getElementById('probs').style.display = 'block';

    const xai = EvoAgent.explain(t);
    let xaiHtml = '<h3>🔍 Почему такое решение?</h3>';
    xai.reasons.forEach(r => { xaiHtml += `<div>${r}</div>`; });
    document.getElementById('xaiBox').innerHTML = xaiHtml;
    document.getElementById('xaiBox').style.display = 'block';

    showToast('✅ Анализ завершён', 'ok');
  } catch (e) {
    showToast('❌ Ошибка: ' + e.message, 'err');
  }
}

function loadSample(i) {
  const s = [
    'ДОГОВОР ПОСТАВКИ №123\nМежду ООО «Альфа» и АО «Бета». Сумма: 500 000 руб.',
    'СЧЁТ №456\nООО «ТехноСервис», ИНН 7701234567. Сумма: 1 250 000 руб.',
    'ПРЕТЕНЗИЯ №78\nНарушение сроков. Требуем неустойку.'
  ];
  document.getElementById('doc').value = s[i];
}

document.getElementById('doc').addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'Enter') {
    e.preventDefault();
    analyze();
  }
});
</script>
</body>
</html>
